# ============================================================================
# 套利系统统一配置文件
# ============================================================================
# 
# 所属系统: 套利执行终端 V3（基础模式 / 传统套利）
# 使用模块: core/services/arbitrage_monitor_v2/config/unified_config_manager.py
# 说明: 涵盖价差&资金费率决策、执行/风险配置，UI 为 V3 终端
# ============================================================================

# ============================================================================
# 系统运行模式配置（仅 V3 基础模式使用，分段网格仍沿用 segmented.yaml 的 system_mode）
# ============================================================================
system_mode:
  # 监控模式开关（Monitor Only Mode）
  # true:  只监控，不执行真实订单（所有套利流程正常运行，但不下单）
  # false: 正常模式，执行真实订单
  monitor_only: true   # RH 联调阶段：只监控，不提交真实订单
  
  # 🔥 数据新鲜度配置（Data Freshness）
  # 说明：在进行价差分析时，只使用新鲜度在此阈值内的交易所数据
  # 示例：如果设置为2秒，a、b、c三个交易所中，c的数据超过2秒
  #      则只使用a和b计算价差，b-c和a-c的价差不会被计算
  # 目的：防止使用过期价格数据进行套利决策，避免虚假套利信号
  data_freshness_seconds: 3.0  # 数据新鲜度阈值（秒），默认3秒
  
# ============================================================================
# 套利决策配置（V3 基础模式使用，分段网格仍以 segmented.yaml 的 decision 为准）
# ============================================================================
arbitrage_decision:
  # 决策开关
  enabled: true
  enable_spread_arbitrage: true      # 是否启用价差套利
  enable_funding_rate_arbitrage: true  # 是否启用资金费率套利
  
  # 阈值配置
  thresholds:
    # 价差套利阈值
    spread_arbitrage_threshold: 0.02         # 价差套利触发阈值（百分比）
    spread_persistence_seconds: 2            # 价差连续满足秒数才触发套利
    
    # 资金费率套利阈值
    funding_rate_diff_threshold: 0.01         # 资金费率差套利触发阈值（百分比）
    
    # 可忽视阈值
    ignorable_spread_threshold: 0.05         # 可忽视的差价百分比阈值（百分比）
    ignorable_funding_rate_diff_threshold: 0.01         # 可忽视的资金费率差价百分比阈值（百分比）
    
    # 历史数据时间范围
    history_hours: 24           # 历史记录数据的小时数量（小时）
    
    # 资金费率不利持续时间
    unfavorable_funding_rate_duration_minutes: 60           # 资金费率不利持续时间阈值（分钟）
    
    # 平仓阈值
    profit_target_threshold: 0.02         # 价差盈利百分比阈值（百分比）
    loss_stop_threshold: 0.3          # 价差亏损百分比阈值（百分比）
    
    # 资金费率年化阈值
    funding_rate_annual_threshold: 10.0         # 资金费率年化阈值（百分比/年）
    
    # ========================================================================
    # 🔥 稳定性判断参数配置（可自定义调整）
    # ========================================================================
    
    # ---------- 资金费率差稳定性判断参数 ----------
    # 3个指标都满足才算稳定：持续时间、波动幅度、趋势稳定性
    funding_rate_stability_threshold: 0.5       # 波动系数阈值（标准差/平均值 ≤ 此值）
    funding_rate_min_threshold: 0.01            # 资金费率差最小阈值（用于持续时间判断，默认0.01%）
    funding_rate_duration_ratio: 0.8            # 持续时间占比阈值（≥80%的时间要满足最小阈值）
    funding_rate_extreme_ratio: 0.1             # 极端波动次数占比阈值（≤10%算稳定）
    funding_rate_extreme_multiplier: 1.5        # 极端波动定义（单次变化 > 平均变化 × 1.5倍）
    
    # ---------- 价差稳定性判断参数 ----------
    # 2个指标都满足才算稳定：波动范围、极端波动
    spread_stability_threshold: 0.5             # 波动系数阈值（标准差/绝对值平均 ≤ 此值）
    spread_extreme_ratio: 0.15                  # 极端波动次数占比阈值（≤15%算稳定）
    spread_extreme_multiplier: 2.0              # 极端波动定义（单次变化 > 平均变化 × 2.0倍）
    
    # ---------- 通用参数 ----------
    min_data_points_for_stability: 10           # 稳定性判断最少数据点要求

# ============================================================================
# 套利执行配置
# -----------------------------------------------------------------------------
# ✅ 参数说明：
#    - default_order_mode / exchange_order_modes / exchange_fees / order_execution 中的限价/滑点/双限价字段：分段网格与 V3 共同使用
#    - quantity_config：仅 V3 基础模式读取；分段网格使用 segmented.yaml 中每个 symbol 的 base_quantity
#    - order_execution.round_pause_seconds：仅 V3 使用（分段模式强制 0）
#    - order_execution.partial_fill_strategy、risk_control.*（min_order_size/price_change_check 等）：尚未在执行器实现，当前任何模式都不会引用
# ============================================================================
arbitrage_execution:
  # 默认下单模式
  default_order_mode: "limit_market"  # limit_market 或 market_market（共用）
  
  # 🔥 数量配置（直接使用代币数量）
  quantity_config:
    # 默认配置（适用于所有代币）
    default:
      single_order_quantity: 0.10         # 单笔下单数量（代币本位，仅V3）
      max_position_quantity: 0.20         # 最大持仓数量（代币本位，仅V3）
      quantity_precision: 4               # 数量精度（小数位数，仅V3）
    
    # 代币特定配置（可选，覆盖默认配置）
    BTC-USDC-PERP:
      single_order_quantity: 0.0015       # 约等于100 USDC价值（仅V3）
      max_position_quantity: 0.0030       # （仅V3）
      quantity_precision: 3               # BTC步进为0.001（仅V3）
    
    ETH-USDC-PERP:
      single_order_quantity: 0.0300       # （仅V3）
      max_position_quantity: 0.0600       # （仅V3）
      quantity_precision: 2               # ETH步进为0.01（仅V3）
    
    SOL-USDC-PERP:
      single_order_quantity: 1.700        # （仅V3）
      max_position_quantity: 3.400        # （仅V3）
      quantity_precision: 1               # SOL步进0.1（仅V3）
  
  # 交易所下单模式配置（分段网格会读取，决定每条腿的限价/市价策略）
  exchange_order_modes:
    edgex:
      order_mode: "limit"               # 下单模式：限价单（最快）（共用）
      priority: 4                       # 🔥 下单优先级最高（共用）
      limit_price_offset_pct: 0.0       # 价格偏移为0（使用tick精度策略）（共用）
      use_tick_precision: true          # 🔥 ✅ Tick优先：开启后强制按“买单=卖一-1tick、卖单=买一+1tick”的被动方式下单，并自动忽略 symbol_config 里的绝对/百分比偏移；只有把此开关设为 false，才会回到激进偏移模式
    
    backpack:
      order_mode: "limit"               # 下单模式：限价单（其次）（共用）
      priority: 3                       # 🔥 下单优先级其次（共用）
      limit_price_offset_pct: 0.0       # 价格偏移为0（使用tick精度策略）（共用）
      use_tick_precision: true          # 🔥 ✅ Tick优先：开启后强制按“买单=卖一-1tick、卖单=买一+1tick”的被动方式下单，并自动忽略 symbol_config 里的绝对/百分比偏移；只有把此开关设为 false，才会回到激进偏移模式
    
    paradex:
      order_mode: "limit"               # Paradex 使用限价单 + SDK 签名（共用）
      priority: 2                       # 与 Backpack 同级，优先跟随高速交易所（共用）
      limit_price_offset_pct: 0         # 价格偏移万分之5，保证挂单在盘口内（共用）
      use_tick_precision: true          # 🔥 ✅ Tick优先：开启后强制按“买单=卖一-1tick、卖单=买一+1tick”的被动方式下单，并自动忽略 symbol_config 里的绝对/百分比偏移；只有把此开关设为 false，才会回到激进偏移模式
    
    lighter:
      order_mode: "market"              # 🔥 改用限价单吃单模式（避免WS市价单nonce问题）（共用）
      priority: 1                       # 🔥 下单优先级最低（最后下单）（共用）
      limit_price_offset_pct: 0.001     # 🔥 统一执行层的默认激进偏移：百分比基准（0.1%），仅在该交易所 use_tick_precision=false 时生效，用于 lighter 第二腿补单等吃单场景（symbol_config 若未覆写，则沿用这里的值）
      use_tick_precision: false         # 🔥 ✅ Tick优先：开启后强制按“买单=卖一-1tick、卖单=买一+1tick”的被动方式下单，并自动忽略 symbol_config 里的绝对/百分比偏移；只有把此开关设为 false，才会回到激进偏移模式
      force_sequential_limit: false      # 🔥 强制顺序执行：即使双方都是limit模式，也采用limit+market模式（先等对手成交，再用激进限价单吃单）（共用）
      force_limit_when_second_leg: false  # 🔥 限价+市价模式中若 lighter 充当第二腿，强制改用激进限价顺序执行
      reuse_signal_price_when_second_leg: false  # 🔧 第二腿激进限价是否复用决策引擎的信号价（true=不重新拉盘口价）
      smart_second_leg_price: true      # 🔧 智能盘口价格切换：true=根据第一腿表现自动决定是否复用信号价
    
    # 针对同一交易所不同交易对的精细化设置（示例：lighter 内部多腿套利）
    lighter:PAXG-USD-PERP:
      order_mode: "market"               # PAXG 腿改为限价单，配合双限价模式（共用）
      priority: 1
    lighter:XAU-USD-PERP:
      order_mode: "market"               # XAU 腿使用限价单（保护卖盘）（共用）
      priority: 1
    
    # 默认配置（如果交易所不在上述列表中）
    default:
      order_mode: "market"              # 默认使用市价单（共用）
      priority: 0                       # 默认优先级最低（共用）
  
  # 交易所手续费配置（分段网格在“扣除手续费”时同步使用）
  exchange_fees:
    default:
      limit_fee_rate: 0.0001            # 限价默认万分之1 0.0001 表示 0.01%（也就是万分之 1，0.0001 × 100 = 0.01%）。
      market_fee_rate: 0.0002           # 市价默认万分之3
    edgex:
      limit_fee_rate: 0.0001            # （共用）
      market_fee_rate: 0.0003           # （共用）
    backpack:
      limit_fee_rate: 0.0001            # （共用）
      market_fee_rate: 0.00025           # （共用）
    paradex:
      limit_fee_rate: 0.0               # 官方 Maker 0手续费（共用）
      market_fee_rate: 0.0002           # Taker 费率约 0.05%（共用）
    lighter:
      limit_fee_rate: 0.0               # （共用）
      market_fee_rate: 0.0              # （共用）

  # 交易所限流配置（共用，限制同一交易所在短时间内的下单数量/节奏，避免触发API限速）
  exchange_rate_limits:
    default:
      max_concurrent_orders: 1          # 默认同一时间只允许1笔（共用）
      min_interval_ms: 0                # 默认不额外限制节奏（共用）
      rate_limit_cooldown_ms: 1000      # 触发限流后额外等待1秒（共用）
    edgex:
      max_concurrent_orders: 1          # EdgeX 官方: 2 ops / 2s，需要串行（共用）
      min_interval_ms: 1200             # 至少间隔1.2秒再向 EdgeX 下单（共用）
      rate_limit_cooldown_ms: 2000      # 被限流后额外冷却1.5秒（共用）
    lighter:
      max_concurrent_orders: 1          # 限价单支持并发（共用）
      min_interval_ms: 1500              # 限价单间隔 0.5 秒（比市价单更宽松）（共用）
      rate_limit_cooldown_ms: 800       # 若返回限流，冷却 0.8 秒（共用）
    backpack:
      max_concurrent_orders: 10
      min_interval_ms: 600
      rate_limit_cooldown_ms: 1000
    paradex:
      max_concurrent_orders: 1
      min_interval_ms: 800
      rate_limit_cooldown_ms: 1200
  
  # 订单执行参数（限价等待/滑点/双限价等，分段网格与 V3 共用）
  order_execution:
    limit_order_timeout: 3               # 🔥 限价订单等待时间（秒）（共用）
    lighter_market_order_timeout: 60       # 🔥 lighter市价订单专用等待时间（秒）
    max_retry_count: 3                   # 订单重试次数（共用）
    partial_fill_strategy: "cancel"      # 🔥 5秒未完全成交则取消订单（未实现）
    round_pause_seconds: 60              # 🔥 每轮成交完成后的等待时间（秒，分段模式固定0）
    enable_dual_limit_mode: true         # 同交易所可启用双限价并行模式（共用）
    dual_limit_retry_initial_delay: 5   # 双限价全未成交后的初始避让秒数（共用）
    dual_limit_retry_max_delay: 60      # 双限价避让的最大等待秒数（共用）
    dual_limit_retry_backoff_factor: 2.0 # 避让倍数，逐次翻倍直至上限（共用）
    
    # 滑点保护（市价单）
    slippage_protection:
      enabled: true                 # （共用）
      max_slippage: 0.001          # 🔥 默认滑点容忍度（千分之1），仅在套利对未设置时兜底
  
  # 风险控制（遗留字段，执行器仍用来兜底 min/max order size）
  risk_control:
    max_order_size: 1.0            # 最大订单数量（已废弃，由quantity_config替代）
    min_order_size: 0.001          # 最小订单数量（已废弃，由quantity_config替代）
    
    # 价格变化检查（下单前检查价格是否变化过大）
    price_change_check:
      enabled: true
      max_price_change: 0.01       # 最大允许价格变化（百分比） 目前这组参数没有实际作用，是预留/遗留字段。

# ============================================================================
# 全局风险控制配置（仅 V3 基础模式使用；分段网格使用 segmented.yaml 第4节）
# ============================================================================
risk_control:
  # 仓位管理
  position_management:
    max_single_token_position: 10.0      # 🔥 单一代币最大持仓数量（作为默认/兜底）
    max_total_position: 30.0             # 所有代币总持仓数量（绝对值之和）
  
  # 账户余额管理
  balance_management:
    min_balance_warning: 50.0            # 余额不足警告阈值（USDC价值）
    min_balance_close_position: 40.0     # 🔥 余额不足40 USDC时平仓
    check_interval: 60                   # 余额检查间隔（秒）
  
  # 网络故障处理
  network_failure:
    enabled: true
    reconnect_interval: 30               # 重连检测间隔（秒）
    max_reconnect_attempts: 100000000           # 最大重连次数
    auto_resume: true                    # 网络恢复后自动恢复
  
  # 交易所维护检测
  exchange_maintenance:
    enabled: true
    check_interval: 60                   # 维护检测间隔（秒）
    maintenance_error_codes: [503, 502]  # 维护错误码列表
    auto_resume: true                    # 恢复后自动恢复
  
  # 价格异常检测
  price_anomaly:
    enabled: true
    max_price_change_rate: 0.05         # 最大允许价格变化率（5%）
    check_window: 5                      # 检查时间窗口（分钟）
  
  # 订单执行异常检测
  order_anomaly:
    enabled: true
    max_order_wait_time: 300            # 订单最大等待时间（秒）
    auto_cancel_timeout: true           # 超时自动取消
  
  # 资金费率异常检测
  funding_rate_anomaly:
    enabled: true
    max_funding_rate_change: 0.3       # 最大允许资金费率变化（1%）
  
  # 持仓时间限制
  position_duration:
    enabled: true
    max_position_duration: 24          # 最大持仓时间（小时，7天）
    auto_close_on_timeout: true         # 超时自动平仓
  
  # 单次交易风险限制
  single_trade_risk:
    enabled: true
    max_single_trade_loss: 1000.0       # 单次交易最大亏损（USDC价值）
  
  # 每日交易次数限制
  daily_trade_limit:
    enabled: true
    max_daily_trades: 100               # 每日最大交易次数
  
  # 交易对风险限制
  symbol_risk:
    disabled_symbols: []                # 暂停交易对列表
    high_risk_symbols: []              # 高风险交易对列表（额外监控）
  
  # 数据一致性检查
  data_consistency:
    enabled: true
    check_interval: 300                  # 一致性检查间隔（秒）
    auto_fix: true                      # 自动修复不一致数据

